<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>⚡ Pika's Thunderbolt</title>
<style>
  html,body{margin:0;height:100%;background:#070a14;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  #c{display:block;width:100vw;height:100vh;cursor:crosshair}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:radial-gradient(ellipse at 50% 45%, rgba(24,32,60,.88), rgba(4,6,13,.97));z-index:10;transition:opacity .7s}
  #overlay.hide{opacity:0;pointer-events:none}
  #title{color:#ffe14d;font-size:clamp(22px,4vw,40px);font-weight:900;font-style:italic;letter-spacing:1px;
    text-shadow:0 0 24px rgba(255,220,80,.55),0 2px 0 #4a3400}
  #btn{border:none;cursor:pointer;padding:18px 44px;font-size:clamp(18px,2.6vw,26px);font-weight:900;font-style:italic;
    color:#241a00;background:linear-gradient(180deg,#ffe95e,#ffc912);border-radius:999px;letter-spacing:1px;
    box-shadow:0 0 34px rgba(255,215,60,.6),0 6px 0 #9a7400;transition:transform .12s}
  #btn:hover{transform:scale(1.06)}
  #btn:active{transform:scale(.97)}
  #sub{color:#8fa0c9;font-size:14px;letter-spacing:.5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="title">⚡ Pika's Thunderbolt ⚡</div>
  <button id="btn">CHARGE UP</button>
  <div id="sub">sound on — click anywhere mid-scene to strike early</div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, S;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.max(0.45, Math.min(1.5, Math.min(W, H) / 640));
}
addEventListener('resize', resize); resize();

/* ================= AUDIO (Web Audio, synthesized) ================= */
let AC = null, master, noiseBuf, humGain, hum1, hum2;
function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
  const len = AC.sampleRate * 3;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  humGain = AC.createGain(); humGain.gain.value = 0; humGain.connect(master);
  hum1 = AC.createOscillator(); hum1.type = 'sawtooth'; hum1.frequency.value = 42;
  hum2 = AC.createOscillator(); hum2.type = 'sine';   hum2.frequency.value = 84;
  hum1.connect(humGain); hum2.connect(humGain); hum1.start(); hum2.start();
}
function playCrack(delay = 0, vol = 1){
  if (!AC) return;
  const t = AC.currentTime + delay;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.7;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.4);
}
function playRumble(delay = 0, vol = 0.7, dur = 2.2){
  if (!AC) return;
  const t = AC.currentTime + delay;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true; src.playbackRate.value = 0.5;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(320, t); lp.frequency.exponentialRampToValueAtTime(55, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const lfo = AC.createOscillator(); lfo.frequency.value = 8 + Math.random() * 5;
  const lg = AC.createGain(); lg.gain.value = vol * 0.35;
  lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.1);
}
function sparkTick(vol = 0.12){
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 2 + Math.random();
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2000 + Math.random() * 4000;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  src.connect(hp); hp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.07);
}

/* ================= WORLD ================= */
let gndY, rockX, rockY, rockR;
function layout(){
  gndY = H * 0.80;
  rockX = W * 0.76; rockY = gndY - rockR * 0.55;
}
let rockSeed = [], rockCracks = [];
function resetRock(){
  rockR = 42 * S;
  rockSeed = [];
  for (let i = 0; i < 9; i++){
    const a = (i / 9) * Math.PI * 2;
    rockSeed.push([a, 0.75 + Math.random() * 0.45]);
  }
  rockCracks = [];
  layout();
}
resetRock(); addEventListener('resize', layout);

const clouds = [];
for (let i = 0; i < 7; i++) clouds.push({x: Math.random(), y: 0.05 + Math.random() * 0.3, r: 90 + Math.random() * 130, spd: 4 + Math.random() * 8});
const rain = [];
for (let i = 0; i < 90; i++) rain.push({x: Math.random(), y: Math.random(), spd: 500 + Math.random() * 400, len: 10 + Math.random() * 14});

let bolts = [], sparks = [], chunks = [], smokes = [];
let shake = 0, flash = 0, farFlash = 0, farTimer = 2 + Math.random() * 4;
let state = 'idle', stateT = 0, humLevel = 0, running = false;

function to(s){ state = s; stateT = 0; }

function makeBoltPts(x1, y1, x2, y2, seg, amp){
  const pts = [], dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  for (let i = 0; i <= seg; i++){
    const t = i / seg;
    const o = (i === 0 || i === seg) ? 0 : (Math.random() - 0.5) * 2 * amp * Math.sin(t * Math.PI);
    pts.push([x1 + dx * t + nx * o, y1 + dy * t + ny * o]);
  }
  return pts;
}
function spawnBolt(x1, y1, x2, y2){
  const main = {pts: makeBoltPts(x1, y1, x2, y2, 16, 22), branches: [], life: 1};
  const ang = Math.atan2(y2 - y1, x2 - x1);
  for (let b = 0; b < 4; b++){
    const i = 2 + Math.floor(Math.random() * (main.pts.length - 4));
    const p = main.pts[i];
    const a = ang + (Math.random() - 0.5) * 1.7;
    const bl = 40 + Math.random() * 100;
    main.branches.push({pts: makeBoltPts(p[0], p[1], p[0] + Math.cos(a) * bl, p[1] + Math.sin(a) * bl, 6, 12), life: 1});
  }
  bolts.push(main);
}
function spawnSparks(x, y, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 520;
    sparks.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, life: 1, dec: 1.2 + Math.random() * 2.2,
      c: Math.random() < 0.5 ? '255,236,150' : '190,215,255'});
  }
}
function spawnChunks(x, y, n){
  for (let i = 0; i < n; i++){
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = 150 + Math.random() * 300;
    chunks.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 6,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, life: 1});
  }
}
function rockHit(){
  rockCracks.push([Math.random() * Math.PI * 2, 0.35 + Math.random() * 0.6]);
  rockR *= 0.93; layout();
  if (rockR < 15 * S) resetRock();
}
function doStrike(){
  const px = W * 0.24, py = gndY - 129 * S;
  const cx = px + 40 * S, cy = py - 8 * S;   // right cheek
  spawnBolt(cx, cy, rockX, rockY);
  spawnSparks(rockX, rockY, 46);
  spawnChunks(rockX, rockY, 7);
  for (let i = 0; i < 5; i++) smokes.push({x: rockX + (Math.random() - 0.5) * 30, y: rockY, r: 8 + Math.random() * 14, life: 1});
  playCrack(0, 1); playCrack(0.07, 0.45); playCrack(0.16, 0.3);
  playRumble(0.05, 0.85, 2.4);
  shake = 15; flash = 1;
  rockHit();
}

/* ================= TICK ================= */
function tick(dt){
  stateT += dt;
  shake *= Math.pow(0.0015, dt);
  flash *= Math.pow(0.0004, dt);
  farFlash *= Math.pow(0.001, dt);

  farTimer -= dt;
  if (farTimer <= 0){
    farTimer = 3 + Math.random() * 6;
    farFlash = 1;
    if (running) playRumble(0, 0.12, 1.1);
  }

  let ht = 0;
  if (state === 'charge') ht = Math.min(1, stateT / 1.4);
  else if (state === 'strike') ht = 1;
  else if (state === 'impact') ht = Math.max(0, 1 - stateT / 0.5);
  humLevel += (ht - humLevel) * Math.min(1, dt * 6);
  if (humGain) humGain.gain.value += (0.11 * Math.pow(humLevel, 1.6) - humGain.gain.value) * Math.min(1, dt * 8);

  if (state === 'idle' && stateT > 2.3) to('charge');
  else if (state === 'charge' && stateT > 1.7){ to('strike'); doStrike(); }
  else if (state === 'strike' && stateT > 0.24) to('impact');
  else if (state === 'impact' && stateT > 1.6) to('idle');

  if (state === 'impact' && AC && Math.random() < dt * 26) sparkTick(0.04 + Math.random() * 0.1);

  for (const b of bolts){ b.life -= dt / 0.34; for (const br of b.branches) br.life -= dt / 0.22; }
  bolts = bolts.filter(b => b.life > 0);

  for (const s of sparks){
    s.vy += 620 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= s.dec * dt;
  }
  sparks = sparks.filter(s => s.life > 0);

  for (const c of chunks){
    c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    if (c.y > gndY - 2){ c.y = gndY - 2; c.vy *= -0.38; c.vx *= 0.7; }
    c.life -= dt * 0.7;
  }
  chunks = chunks.filter(c => c.life > 0);

  for (const m of smokes){ m.y -= 26 * dt; m.r += 22 * dt; m.life -= dt * 0.9; }
  smokes = smokes.filter(m => m.life > 0);

  for (const cl of clouds){ cl.x += (cl.spd / W) * dt; if (cl.x > 1.3) cl.x = -0.3; }
  for (const r of rain){ r.y += (r.spd / H) * dt; if (r.y > 1.05){ r.y = -0.05; r.x = Math.random(); } }
}

/* ================= RENDER ================= */
function drawPikachu(t){
  const px = W * 0.24, py = gndY - 129 * S;
  const YELLOW = '#ffd93b', BROWN = '#8b5a2b';
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(S, S);
  const bob = state === 'idle' ? Math.sin(t * 2.2) * 3 : 0;
  const trem = state === 'charge' ? (Math.random() - 0.5) * 3.5 * humLevel : 0;
  const recoil = (state === 'impact' && stateT < 0.18) ? -10 * (1 - stateT / 0.18) : 0;
  ctx.translate(recoil, bob + trem);

  // tail (behind)
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.moveTo(38, -28); ctx.lineTo(78, -62); ctx.lineTo(63, -57);
  ctx.lineTo(106, -114); ctx.lineTo(56, -84); ctx.lineTo(69, -78); ctx.lineTo(44, -18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = YELLOW;
  ctx.beginPath();
  ctx.moveTo(41, -26); ctx.lineTo(73, -59); ctx.lineTo(60, -55);
  ctx.lineTo(98, -106); ctx.lineTo(54, -81); ctx.lineTo(65, -76); ctx.lineTo(45, -21);
  ctx.closePath(); ctx.fill();

  // ears
  const ear = (dir) => {
    ctx.save(); ctx.scale(dir, 1);
    const b1 = [14, -58], b2 = [42, -62], tip = [66, -158];
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.moveTo(b1[0], b1[1]); ctx.lineTo(tip[0], tip[1]); ctx.lineTo(b2[0], b2[1]); ctx.closePath(); ctx.fill();
    const a = [b1[0] + (tip[0] - b1[0]) * 0.45, b1[1] + (tip[1] - b1[1]) * 0.45];
    const b = [b2[0] + (tip[0] - b2[0]) * 0.45, b2[1] + (tip[1] - b2[1]) * 0.45];
    ctx.fillStyle = '#1f1f1f';
    ctx.beginPath(); ctx.moveTo(tip[0], tip[1]); ctx.lineTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  ear(1); ear(-1);

  // body + head
  ctx.fillStyle = YELLOW;
  ctx.beginPath(); ctx.ellipse(0, 58, 50, 56, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -22, 52, 0, Math.PI * 2); ctx.fill();

  // back stripes
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 58, 50, 56, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = BROWN;
  ctx.beginPath(); ctx.ellipse(0, 92, 46, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 105, 39, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // legs
  ctx.fillStyle = YELLOW;
  ctx.beginPath(); ctx.ellipse(-24, 117, 20, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24, 117, 20, 13, 0, 0, Math.PI * 2); ctx.fill();

  // arms
  const armY = state === 'charge' ? -4 : 28;
  const armRot = state === 'charge' ? -1.15 : 0.5;
  const arm = (dir) => {
    ctx.save(); ctx.scale(dir, 1);
    ctx.translate(48, armY); ctx.rotate(armRot);
    ctx.fillStyle = YELLOW;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
  arm(1); arm(-1);

  // cheeks + charge glow
  ctx.fillStyle = '#e8452f';
  ctx.beginPath(); ctx.arc(-38, -8, 13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(38, -8, 13, 0, Math.PI * 2); ctx.fill();
  if (humLevel > 0.02){
    for (const sx of [-38, 38]){
      const r = 26 + 34 * humLevel;
      const g = ctx.createRadialGradient(sx, -8, 2, sx, -8, r);
      g.addColorStop(0, `rgba(255,242,150,${0.95 * humLevel})`);
      g.addColorStop(0.5, `rgba(255,225,90,${0.4 * humLevel})`);
      g.addColorStop(1, 'rgba(255,225,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, -8, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // eyes
  const blink = (t % 3.4) < 0.13;
  ctx.fillStyle = '#222';
  if (blink || state === 'impact'){
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (const ex of [-20, 20]){
      ctx.beginPath(); ctx.arc(ex, -34, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    }
  } else {
    const ry = 8 * (1 - 0.45 * humLevel);
    for (const ex of [-20, 20]){
      ctx.beginPath(); ctx.ellipse(ex, -32, 8, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + 2.4, -34.5, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
    }
  }

  // nose + mouth
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.moveTo(-2.4, -25); ctx.lineTo(2.4, -25); ctx.lineTo(0, -21.5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (state === 'charge' && humLevel > 0.5){
    ctx.fillStyle = '#5a3a1a';
    ctx.beginPath(); ctx.ellipse(0, -13, 5, 6 * humLevel, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(-9, -16); ctx.quadraticCurveTo(-4.5, -11, 0, -16);
    ctx.quadraticCurveTo(4.5, -11, 9, -16);
    ctx.stroke();
  }
  ctx.restore();
}

function strokePts(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function drawBolt(b){
  const a = Math.max(0, b.life) * (0.65 + 0.35 * Math.random());
  if (a <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, a);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,230,120,0.95)';
  ctx.shadowBlur = 26;
  ctx.strokeStyle = 'rgba(255,215,70,0.9)';
  ctx.lineWidth = 8;
  strokePts(b.pts);
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.6;
  strokePts(b.pts);
  for (const br of b.branches){
    const ba = Math.max(0, br.life) * a;
    if (ba <= 0.01) continue;
    ctx.globalAlpha = Math.min(1, ba);
    ctx.strokeStyle = 'rgba(255,225,100,0.85)';
    ctx.lineWidth = 3.5;
    strokePts(br.pts);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.3;
    strokePts(br.pts);
  }
  ctx.restore();
}

function drawRock(){
  ctx.save();
  ctx.translate(rockX, rockY);
  ctx.fillStyle = '#39415a';
  ctx.beginPath();
  rockSeed.forEach((p, i) => {
    const x = Math.cos(p[0]) * rockR * p[1], y = Math.sin(p[0]) * rockR * p[1];
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#465170';
  ctx.beginPath();
  rockSeed.forEach((p, i) => {
    const x = Math.cos(p[0] - 0.25) * rockR * p[1] * 0.6, y = Math.sin(p[0] - 0.25) * rockR * p[1] * 0.6 - rockR * 0.18;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(10,12,20,0.9)'; ctx.lineWidth = 2;
  for (const c of rockCracks){
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(c[0]) * rockR * c[1], Math.sin(c[0]) * rockR * c[1]);
    ctx.stroke();
  }
  ctx.restore();
}

function render(t){
  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a0e1e');
  sky.addColorStop(0.65, '#131a30');
  sky.addColorStop(1, '#0b0f1c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // far lightning on horizon
  if (farFlash > 0.02){
    const g = ctx.createLinearGradient(0, H * 0.45, 0, gndY);
    g.addColorStop(0, 'rgba(120,150,255,0)');
    g.addColorStop(1, `rgba(140,170,255,${0.3 * farFlash})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, H * 0.45, W, gndY - H * 0.45);
  }

  // clouds
  for (const cl of clouds){
    const cx = cl.x * W, cy = cl.y * H, r = cl.r * (0.8 + 0.4 * S);
    const bright = 30 + flash * 90 + farFlash * 40;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(${bright + 10},${bright + 16},${bright + 40},0.55)`);
    g.addColorStop(1, 'rgba(20,26,48,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }

  // rain
  ctx.strokeStyle = 'rgba(150,175,230,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const r of rain){
    const x = r.x * W, y = r.y * H;
    ctx.moveTo(x, y);
    ctx.lineTo(x - 3, y + r.len);
  }
  ctx.stroke();

  // ground
  const gnd = ctx.createLinearGradient(0, gndY, 0, H);
  gnd.addColorStop(0, '#161d33');
  gnd.addColorStop(1, '#080b15');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, gndY, W, H - gndY);
  if (flash > 0.03){
    ctx.fillStyle = `rgba(255,235,160,${flash * 0.12})`;
    ctx.fillRect(0, gndY, W, H - gndY);
  }

  drawRock();
  for (const m of smokes){
    ctx.fillStyle = `rgba(140,150,170,${0.22 * m.life})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  }
  for (const c of chunks){
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, c.life);
    ctx.fillStyle = '#3d4660';
    ctx.beginPath();
    ctx.moveTo(-c.r, c.r * 0.6); ctx.lineTo(0, -c.r); ctx.lineTo(c.r, c.r * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  drawPikachu(t);

  for (const b of bolts) drawBolt(b);

  for (const s of sparks){
    ctx.strokeStyle = `rgba(${s.c},${Math.min(1, s.life)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 0.02, s.y - s.vy * 0.02);
    ctx.stroke();
  }

  // comic text
  if (state === 'strike' || state === 'impact'){
    const p = state === 'strike' ? stateT / 0.24 : 1;
    const scale = 1 + 0.5 * Math.max(0, 1 - p * 2.5);
    const alpha = state === 'strike' ? 1 : Math.max(0, 1 - stateT / 1.2);
    ctx.save();
    ctx.translate(W * 0.58, H * 0.28);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = `italic 900 ${Math.round(40 * S + 20)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 9; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(40,20,0,0.85)';
    ctx.strokeText('THUNDERBOLT!', 0, 0);
    ctx.fillStyle = '#ffe14d';
    ctx.fillText('THUNDERBOLT!', 0, 0);
    ctx.restore();
  }

  // screen flash
  if (flash > 0.01){
    ctx.fillStyle = `rgba(255,244,200,${flash * 0.75})`;
    ctx.fillRect(0, 0, W, H);
  }

  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

/* ================= LOOP ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  tick(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= INPUT ================= */
document.getElementById('btn').addEventListener('click', () => {
  initAudio();
  if (AC.state === 'suspended') AC.resume();
  running = true;
  document.getElementById('overlay').classList.add('hide');
});
cv.addEventListener('pointerdown', () => {
  if (!running) return;
  if (state === 'idle' || state === 'impact') to('charge');
});
})();
</script>
